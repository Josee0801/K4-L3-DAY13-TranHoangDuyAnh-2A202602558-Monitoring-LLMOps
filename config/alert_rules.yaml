alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-oncall
    runbook: docs/alerts.md#alert-1-high-latency-p95
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-oncall
    runbook: docs/alerts.md#alert-2-high-error-rate
  - name: LowRetrievalSuccess
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 10m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-oncall
    runbook: docs/alerts.md#alert-3-low-retrieval-success
